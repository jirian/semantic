name = "semantic"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Semantic", "Examples"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = true
relaxedAutoImplicit = true
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "Semantic"

# Worked examples for the splitting extension; kept out of the root import.
[[lean_lib]]
name = "Examples"
roots = ["Semantic.CoreCapybara.Examples"]
